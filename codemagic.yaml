workflows:
  android-debug:
    name: FreeLabelPrinter Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PROJECT_DIR: "build_source"
    scripts:
      - name: Extract Android project
        script: |
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q FreeLabelPrinter_project.zip -d "$PROJECT_DIR"
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -50
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/$PROJECT_DIR/local.properties"
      - name: Build debug APK
        script: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
    artifacts:
      - build_source/app/build/outputs/apk/debug/*.apk

  android-release:
    name: FreeLabelPrinter Android Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PROJECT_DIR: "build_source"
    scripts:
      - name: Extract Android project
        script: |
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q FreeLabelPrinter_project.zip -d "$PROJECT_DIR"
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/$PROJECT_DIR/local.properties"
      - name: Build release APK
        script: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon
    artifacts:
      - build_source/app/build/outputs/apk/release/*.apk
