workflows:
  free-android-debug:
    name: FreeLabelPrinter Android Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Verify Android project
        script: |
          test -f settings.gradle
          test -d app
          test -f app/build.gradle
          echo "Android project structure OK"
      - name: Build Android Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
